services:
  - type: web
    name: reposage-worker
    runtime: docker
    dockerfilePath: ./reposage/Dockerfile.worker
    dockerContext: ./reposage
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      - key: WORKER_CONCURRENCY
        value: '2'
      - key: WORKER_HEALTH_PORT
        value: '10000'
      - key: SKIP_ENV_VALIDATION
        value: '1'
