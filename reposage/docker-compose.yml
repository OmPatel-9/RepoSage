services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reposage-postgres
    environment:
      POSTGRES_USER: reposage
      POSTGRES_PASSWORD: reposage
      POSTGRES_DB: reposage
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reposage -d reposage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: reposage-redis
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
